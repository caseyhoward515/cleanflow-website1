<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="cf-emblem-title">
  <title id="cf-emblem-title">CleanFlow of Ohio emblem: a water droplet flowing into a clear gutter channel</title>
  <defs>
    <linearGradient id="cfBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3c72"/>
      <stop offset="1" stop-color="#2c5aa0"/>
    </linearGradient>
    <linearGradient id="cfDrop" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f6b545"/>
      <stop offset="1" stop-color="#e67e22"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#cfBadge)"/>

  <!-- decorative rings, echoing the site hero treatment -->
  <circle cx="430" cy="86" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="74" cy="446" r="92" fill="#ffffff" fill-opacity="0.07"/>

  <!-- water droplet -->
  <path d="M256 96c46 62 74 104 74 140a74 74 0 0 1-148 0c0-36 28-78 74-140z" fill="url(#cfDrop)"/>
  <path d="M226 232a30 30 0 0 0 22 30" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>

  <!-- gutter channel in section, catching the drop -->
  <path d="M120 336h272v52a56 56 0 0 1-56 56H176a56 56 0 0 1-56-56z" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  <path d="M120 336h272" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>

  <!-- flow lines moving through the channel -->
  <path d="M176 392h44" stroke="#f39c12" stroke-width="16" stroke-linecap="round"/>
  <path d="M244 392h92" stroke="#f39c12" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>
</svg>
